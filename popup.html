<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=380">
<title>Cinemana Downloader</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 380px;
    min-height: 420px;
    background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #ffffff;
    display: flex;
    justify-content: center;
    padding: 12px 10px;
    direction: rtl;
  }

  .container {
    background: rgba(20, 20, 40, 0.8);
    border-radius: 24px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    padding: 18px 15px;
    width: 100%;
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .header {
    text-align: center;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .header-icon {
    font-size: 28px;
    display: block;
    margin-bottom: 4px;
    filter: drop-shadow(0 4px 15px rgba(255, 0, 0, 0.3));
  }

  .header h1 {
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(255, 0, 0, 0.3);
    letter-spacing: 0.5px;
  }

  .section {
    margin-bottom: 10px;
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.55);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .btn {
    display: inline-block;
    padding: 8px 14px;
    background: linear-gradient(135deg, #ff0000 0%, #8b0000 100%);
    border: none;
    border-radius: 12px;
    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: 0 6px 0 #660000, 0 10px 20px rgba(0, 0, 0, 0.4);
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    margin: 3px;
    text-decoration: none;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
    transition: left 0.5s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 0 #660000, 0 14px 30px rgba(255, 0, 0, 0.3);
  }

  .btn:hover::before {
    left: 100%;
  }

  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 4px 0 #660000, 0 6px 15px rgba(0, 0, 0, 0.4);
  }

  .btn.active {
    background: linear-gradient(135deg, #00cc44 0%, #007722 100%);
    box-shadow: 0 6px 0 #005511, 0 10px 20px rgba(0, 200, 0, 0.3);
  }

  .btn.active:hover {
    box-shadow: 0 8px 0 #005511, 0 14px 30px rgba(0, 200, 0, 0.4);
  }

  .btn.active:active {
    box-shadow: 0 4px 0 #005511, 0 6px 15px rgba(0, 0, 0, 0.4);
  }

  .quality-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .quality-grid .btn {
    width: 100%;
    text-align: center;
    padding: 8px 6px;
    font-size: 11px;
    margin: 0;
  }

  .quality-grid .btn:last-child:nth-child(odd) {
    grid-column: 1 / -1;
    max-width: 50%;
    justify-self: center;
  }

  .toggle-section .btn {
    display: block;
    width: 100%;
    text-align: center;
    margin: 4px 0;
  }

  .site-btn {
    display: block;
    width: 100%;
    text-align: center;
    margin-top: 8px;
    padding: 10px 16px;
    background: linear-gradient(135deg, #ff0000 0%, #8b0000 100%);
    border: none;
    border-radius: 12px;
    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: 0 6px 0 #660000, 0 10px 20px rgba(0, 0, 0, 0.4);
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    text-decoration: none;
  }

  .site-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
    transition: left 0.5s ease;
  }

  .site-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 0 #660000, 0 14px 30px rgba(255, 0, 0, 0.3);
  }

  .site-btn:hover::before {
    left: 100%;
  }

  .site-btn:active {
    transform: translateY(2px);
    box-shadow: 0 4px 0 #660000, 0 6px 15px rgba(0, 0, 0, 0.4);
  }

  .divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.06);
    margin: 12px 0;
  }

  .version {
    display: none;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <span class="header-icon">🎬</span>
    <h1>Cinemana Downloader</h1>
  </div>

  <div class="section">
    <div class="section-title">جودة الفيديو</div>
    <div class="quality-grid">
      <button class="btn quality-btn" data-quality="2k">2k</button>
      <button class="btn quality-btn" data-quality="1080FHD">1080FHD</button>
      <button class="btn quality-btn" data-quality="720HD">720HD</button>
      <button class="btn quality-btn" data-quality="420p">420p</button>
      <button class="btn quality-btn" data-quality="144p">144p</button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section toggle-section">
    <div class="section-title">صيغة الترجمة</div>
    <button class="btn toggle-btn" id="srtBtn">SRT</button>
  </div>

  <div class="section toggle-section">
    <div class="section-title">صيغة الفيديو</div>
    <button class="btn toggle-btn" id="mp4Btn">MP4</button>
  </div>

  <div class="divider"></div>

  <a href="https://cinemana.shabakaty.com" target="_blank" class="site-btn">زر موقع سينمانا</a>

  <div class="version">v1.0.13</div>

</div>

<script src="popup.js"></script>
</body>
</html>
